
#Compatibility switches. Native SBW armor, direction, ownership and friendly-fire rules remain active.
[compatibility]
	#Use TACZ's configured explosion damage with SBW's native blast exposure/distance formula.
	taczExplosionFix = true
	#Attach the CBC projectile/shooter to vehicle damage sources, including shell blasts. No-owner shots use the projectile as attacker to avoid SBW's null-driver rejection.
	cbcAttributionFix = true
	#Log vehicle hit input, exposure and health loss. Enable only while testing.
	debugDamage = false
	#Prevent one CBC cannon projectile damaging the same vehicle repeatedly while it remains inside the hitbox. Other vehicles and the shell explosion remain hittable. Set false for original CBC repeat-hit behavior.
	cbcOneDirectHitPerVehicle = true

#Multiply incoming damage BEFORE native SBW armor. 1.0 preserves the original damage amount; 0 disables damage.
[balance]
	#Range: 0.0 ~ 1000.0
	taczExplosionMultiplier = 1.0
	#Range: 0.0 ~ 1000.0
	cbcDirectMultiplier = 1.0
	#Range: 0.0 ~ 1000.0
	cbcExplosionMultiplier = 1.0
	#Exact TACZ gun ID = additional multiplier, e.g. tacz:rpg7=1.0. Multiplies the global factor.
	taczGunMultipliers = ["tacz:rpg7=1.0"]
	#Exact projectile IDs; applies only to direct impacts. Multiply the global factor.
	cbcDirectProjectileMultipliers = ["createbigcannons:shot=1.0", "createbigcannons:ap_shot=1.0", "createbigcannons:ap_shell=1.0", "createbigcannons:he_shell=1.0"]
	#Exact projectile IDs; applies only to explosions. Multiply the global factor. CBC keeps its radius-based blast formula.
	cbcExplosionProjectileMultipliers = ["createbigcannons:ap_shell=1.0", "createbigcannons:he_shell=1.0"]
	#Exact SBW vehicle ID = additional incoming-damage multiplier. Applies only to compatibility-handled CBC direct/blast and TACZ blast hits; SBW's own weapons are unchanged.
	vehicleMultipliers = []

[equipment]
	#Set false to allow the Netherite Hammer.
	disableNetheriteHammer = true
	#Set false to allow the DPS Generator and deployer.
	disableDpsGenerator = true

[armor]
	mountedWeaponArmor = true
	advancedArmor = false
	ricochets = true
	componentHits = true

[impactFeedback]
 enabled = true
 shooterFeedback = true
 minimumIntervalTicks = 2
 penetrationSound = "minecraft:block.anvil.land"
 blockedSound = "minecraft:item.shield.block"
 ricochetSound = "minecraft:item.trident.hit"
 volume = 0.65
 penetrationPitch = 1.3
 blockedPitch = 0.8
 ricochetPitch = 1.8

[inspection]
	mountedDetails = true
 vehicleRange = 200.0
